# 256-colour + true-colour passthrough
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"

# Ensure a UTF-8 locale so box-drawing/glyph output renders correctly,
# regardless of whether /etc/environment was picked up by the entry shell.
set-environment -g LANG C.UTF-8
set-environment -g LC_ALL C.UTF-8

# Large scrollback; reduce escape delay for vim/editors
set -g history-limit 50000
set -sg escape-time 10

set -g mouse on

# Windows and panes start at 1; renumber gaps automatically
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# On first session creation: split into a 2x2 tiled layout and start claude in each pane.
# The hook fires only on `new-session`, not on re-attach (-A), so repeated `--mode tmux`
# invocations land back in the existing session without spawning duplicate agents.
set-hook -g after-new-session \
  'split-window -h ; split-window -v ; select-pane -t 1 ; split-window -v ; select-layout tiled ; send-keys -t 1 claude Enter ; send-keys -t 2 claude Enter ; send-keys -t 3 claude Enter ; send-keys -t 4 claude Enter ; select-pane -t 1'

# --- Key bindings ---
# Split: | for vertical, - for horizontal; new window — all inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation without releasing prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config in-place
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Status bar (dark, matches Claude Code sandbox theme) ---
set -g status-position bottom
set -g status-style          "bg=#1e1e2e fg=#cdd6f4"
set -g status-left           "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right          "#[fg=#585b70] %H:%M  #[fg=#89b4fa]%d-%b "
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style  "bg=#313244 fg=#89b4fa bold"
set -g pane-border-style            "fg=#313244"
set -g pane-active-border-style     "fg=#89b4fa"
