schemaVersion: "2"
kind: mixin
name: claude-custom
displayName: Claude Code custom Sandbox kit
description: Claude Code agent with custom tools and pre-configured settings

permissions:
  network:
    # This mixin merges with the base `claude` agent's allow-list; entries here are
    # additive. The base agent already allows api.anthropic.com and the Claude CDN.
    # Entries below are specific to this kit's install steps:
    allow:
      - code.claude.com
      - docs.claude.com
      # `apt-get update` refreshes every configured apt source from the base
      # template. Keep all template sources allowed for amd64 and arm64 sandboxes.
      - "archive.ubuntu.com:80" # Ubuntu archive (amd64 main, HTTP)
      - "security.ubuntu.com:80" # Ubuntu security updates (amd64, HTTP)
      - "ports.ubuntu.com:80" # Ubuntu archive/security (arm64, HTTP)
      - "download.docker.com:443" # Docker's apt repo, pre-added by shell-docker
      - "registry.npmjs.org:443" # npm registry — needed for `npm install -g prettier`

security:
  privileged: false

environment:
  variables:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8

setup:
  install:
    # - command: "install -m 0644 /home/agent/internal-ca.crt /usr/local/share/ca-certificates/internal-ca.crt && update-ca-certificates"
    #   user: "0"
    #   description: Install internal CA certificate
    - command: apt-get update && apt-get install -y --no-install-recommends fd-find git-secrets jq nano tmux && rm -rf /var/lib/apt/lists/*
      user: "0"
      description: "Update apt index and install additional tools (fd-find, git-secrets, jq, nano, tmux)"
    - command: npm install -g prettier@3
      user: "0"
      description: "Install prettier@3 globally for post-tool-use file formatting"
    - command: |
        set -euo pipefail
        claude update
      user: "1000"
      description: Update the Claude CLI to the latest version
    - command: |
        set -euo pipefail
        mkdir -p /home/agent/.claude
        mv /home/agent/.claude/settings.template.json /home/agent/.claude/settings.json
        chmod +x /home/agent/.claude/statusline.sh
        chmod +x /home/agent/.claude/hooks/prettier-format.sh
        chown -R agent:agent /home/agent/.claude
      user: "0"
      description: Move settings.template.json into place as settings.json and ensure hook scripts are executable
  startup:
    - command:
        [
          "sh",
          "-c",
          '[ -f "${HOME}/CLAUDE.template.md" ] && mv -f "${HOME}/CLAUDE.template.md" "${WORKSPACE_DIR}/../CLAUDE.md" || true',
        ]
      user: "1000"
      description: Install the sandbox CLAUDE.md next to the workspace (idempotent; no-op if already moved on a prior start)
